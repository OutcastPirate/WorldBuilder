<div class="dialogWindow">
  <button class="close" (click)="close()" title="Close">X</button>
  <h1>Add Object</h1>
  <div class="modes">
    <button *ngFor="let m of ['Basic', 'Predefined', 'Custom']" [class.active]="mode == m" (click)="setMode(m)">
      {{m}}
    </button>
  </div>
  <hr>
  <div class="controls">
    <div *ngIf="mode == 'Basic'">
      <div class="shapeParameters">
        <label>Height <input type="number" min="0.1" step="0.1" [(ngModel)]="basicShape.height"></label>
        <label>Width <input type="number" min="0.1" step="0.1" [(ngModel)]="basicShape.width"></label>
        <label>Color <input type="color" [(ngModel)]="basicShape.color"></label>
      </div>
      <div class="buttonGrid">
        <button (click)="addBasicShape('Cube',basicShape)">Add Cube</button>
        <button (click)="addBasicShape('Sphere',basicShape)">Add Sphere</button>
        <button (click)="addBasicShape('Cylinder',basicShape)">Add Cylinder</button>
        <button (click)="addBasicShape('Cone',basicShape)">Add Cone</button>
      </div>
    </div>
    <div *ngIf="mode == 'Predefined'">
      <p class="hint" *ngIf="predefinedAssets.length == 0 && !errorMessage">Loading asset list…</p>
      <div class="buttonGrid">
        <button *ngFor="let asset of predefinedAssets" (click)="addPredefined(asset)" [disabled]="loadingAsset">
          {{asset.name}}
        </button>
      </div>
    </div>
    <div *ngIf="mode == 'Custom'">
      <div class="customShape">
        <p class="hint">* the program only accepts .obj, .gltf and .glb files (.gltf must have its data embedded)</p>
        <label>Model <input type="file" (change)="onFileSelected($event)" accept=".obj, .gltf, .glb"></label>
        <label>Material (optional, OBJ only) <input type="file" (change)="onMaterialFileSelected($event)" accept=".mtl"></label>
        <button (click)="chooseFile()" [disabled]="loadingAsset">Load file</button>
      </div>
    </div>
    <p class="status" *ngIf="loadingAsset">Loading {{loadingAsset}}…</p>
    <p class="status error" *ngIf="errorMessage">{{errorMessage}}</p>
  </div>
</div>
